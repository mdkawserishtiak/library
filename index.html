<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-EX4T8CBSMB"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-EX4T8CBSMB");
    </script>
  </head>
  <body>
    <h1 class="text-5xl font-black text-center mt-10 tracking-tighter">
      Library
    </h1>

    <div class="px-6 mt-10 sm:hidden">
      <div id="card-container"></div>

      <button
        class="w-full flex items-center justify-center gap-2 py-2 bg-black border-2 text-white font-bold tracking-widest uppercase cursor-pointer hover:bg-white hover:text-black transition-all"
        popovertarget="add-book-dialog"
      >
        <img src="./icons/add-book.png" width="33" height="33" />
        Add Book
      </button>
    </div>

    <div class="hidden sm:table mx-auto mt-20 text-center mb-20">
      <table class="**:p-2 sm:w-xl md:w-2xl lg:w-4xl xl:w-6xl">
        <thead class="bg-black text-white uppercase">
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Pages</th>
            <th>Read</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="table-body"></tbody>
      </table>

      <button
        class="w-full flex items-center justify-center gap-2 py-2 bg-black border-2 text-white font-bold tracking-widest uppercase cursor-pointer hover:bg-white hover:text-black transition-all"
        popovertarget="add-book-dialog"
      >
        <img src="./icons/add-book.png" width="37" height="37" />
        Add Book
      </button>
    </div>

    <dialog
      class="w-full h-full px-6 py-6 sm:px-10 lg:px-20 md:px-32 xl:px-40"
      id="add-book-dialog"
      popover
    >
      <form class="flex flex-col gap-5" method="dialog">
        <div class="flex items-center gap-4">
          <label class="uppercase" for="title">Title</label>

          <input
            class="w-full outline-0 border py-0.5 px-1"
            type="text"
            name="title"
            id="title"
            required
          />
        </div>

        <div class="flex items-center gap-4">
          <label class="uppercase" for="author">Author</label>

          <input
            class="w-full outline-0 border py-0.5 px-1"
            type="text"
            name="author"
            id="author"
            required
          />
        </div>

        <div class="flex items-center gap-4">
          <label class="uppercase" for="category">Category</label>

          <select
            class="w-full outline-0 border py-1 px-1 cursor-pointer"
            id="category"
            name="category"
          >
            <option value="uncategorized" selected>Uncategorized</option>
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non fiction</option>
            <option value="poetry">Poetry</option>
            <option value="drama">Drama</option>
          </select>
        </div>

        <div class="flex items-center gap-4">
          <label class="uppercase" for="pages">Pages</label>

          <input
            class="w-full outline-0 border py-0.5 px-1"
            type="number"
            min="1"
            name="pages"
            id="pages"
            required
          />
        </div>

        <div class="flex items-center gap-4">
          <label class="uppercase" for="read">Read</label>

          <input type="checkbox" name="read" id="read" />
        </div>

        <button
          class="w-full flex items-center justify-center gap-2 py-2 bg-black border-2 text-white font-bold tracking-widest uppercase cursor-pointer hover:bg-white hover:text-black transition-all"
          id="add-book-button"
        >
          <img src="./icons/add-book.png" width="30" height="30" />
          Add Book
        </button>
      </form>

      <button
        class="w-full mt-2 py-2 bg-black border-2 text-white font-bold tracking-widest uppercase cursor-pointer hover:bg-white hover:text-black transition-all"
        popovertarget="add-book-dialog"
        popovertargetaction="hide"
      >
        Close
      </button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
